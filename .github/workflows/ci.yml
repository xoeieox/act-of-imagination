name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Secret scrub (I-4 - tracked .env family + key-shaped strings)
        run: npm run check:secrets

      - name: Invariant greps (I-1/F-2 endpoint pins, F-1 provider-SDK importers, I-6a server-module imports)
        run: npm run check:invariants

      - name: No demo route surface (OD-6 - the app is live or it's nothing)
        run: |
          # DoD #9: the rejected demo path must not exist as a route anywhere -
          # checked structurally (route directories) so the guard itself never
          # writes the literal the check forbids.
          if find src -type d -iname '*demo*' -not -path '*/node_modules/*' | grep -q .; then
            echo "::error::a demo route directory exists - OD-6 rejected the demo path"
            exit 1
          fi
          if find src -type f \( -name '+page.svelte' -o -name '+page.server.js' -o -name '+server.js' \) -iname '*demo*' | grep -q .; then
            echo "::error::a demo route module exists - OD-6 rejected the demo path"
            exit 1
          fi
          echo "no demo route surface"

      - name: Lint + format check + tests + build (same chain as a local run)
        run: npm run ci

      - name: Honest first run (DoD #9 - zero .env, server-rendered lane state, 501 fail-closed routes)
        run: node scripts/check-first-run.mjs

      - name: Post-build invariants (I-6b - no AOI_LLM_ strings in the client bundle)
        run: npm run check:invariants

      - name: Post-build route list has no replay or demo route entry
        run: |
          if find .svelte-kit/output/server/entries -iname '*demo*' | grep -q .; then
            echo "::error::built route tree contains a demo entry"
            exit 1
          fi
          echo "built route tree clean"
