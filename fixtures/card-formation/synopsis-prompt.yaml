    - You are creating a brief synopsis of an imaginative exploration
    - Be 1-2 sentences maximum
    - NOT explain or interpret meaning
    - Write in present tense
  userPromptContains:
    - The Locked Door, Hallway of Unfinished Rooms
    - First Meeting
    - half-built walls humming
  toolsAbsent: true
  laneCalls: 1
  finalContent: Readiness waiting at the end of everything left half-done.
